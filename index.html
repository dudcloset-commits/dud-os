*{margin:0;padding:0;box-sizing:border-box}
:root{

  --border:#282836;
  --or:#E60012;
  --or-glow:rgba(230,0,18,0.22);

  --text:#F4F4F6;

  --dim:#525266;
  --ok:#10B981;
  --warn:#F59E0B;
  --err:#EF4444;
  --wa:#25D366;

}
body.theme-neon{
  --or:#FF6B00;
  --or-glow:rgba(255,107,0,0.22);
}
body.theme-obsidian{
  --or:#E11D48;
  --or-glow:rgba(225,29,72,0.18);
  --bg:#030304;
  --surf:#09090C;
  --card:#0F0F14;
}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%, var(--or-glow) 0%, transparent 32%),
    radial-gradient(circle at 88% 82%, rgba(255,107,0,0.08) 0%, transparent 35%),
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
input,select,textarea,button{font-family:inherit}
input,select,textarea{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:9px 12px;
  font-size:13px;
  width:100%;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--or);
  box-shadow:0 0 0 2px var(--or-glow);
}
button{
  cursor:pointer;
  border-radius:8px;
  font-weight:600;
  font-size:12.5px;
  transition:all .18s ease;
  white-space:nowrap;
}
button:hover{transform:translateY(-1px);opacity:.93}
button:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg, var(--or), #99000C);
  color:#fff;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 4px 16px var(--or-glow);
  font-weight:800;
}
body.theme-neon .btn-primary{
  background:linear-gradient(135deg, #FF6B00, #CC4400);
  color:#000;
}
.card{
  background:rgba(20,20,27,0.88);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:5px;
  padding:2px 8px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 11px;text-align:left;font-size:12px;border-bottom:1px solid var(--border)}
th{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:rgba(14,14,18,0.9);font-weight:700}
tr:hover td{background:rgba(255,255,255,0.015)}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;
}
.modal{
  background:#111118;border-radius:14px;padding:24px;width:100%;max-width:520px;
  max-height:92vh;overflow-y:auto;border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.85);
}
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  padding:11px 24px;border-radius:30px;font-size:13px;font-weight:700;
  z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.65);white-space:nowrap;
}
.lbl{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.pill{border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:11px;background:var(--card2);color:var(--muted)}
.pill.active{background:var(--or);color:#fff;border-color:var(--or);font-weight:800;box-shadow:0 0 12px var(--or-glow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.scrollx{overflow-x:auto}
.mono{font-family:'JetBrains Mono',monospace}
.script-font{font-family:'Caveat',cursive}
.fashion-warning{
  border:2px solid var(--or);
  border-radius:10px;
  padding:8px 14px;
  background:rgba(230,0,18,0.07);
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.bg-watermark{
  position:fixed;
  bottom:-40px;
  right:-30px;
  opacity:0.035;
  pointer-events:none;
  z-index:0;
}
@media print{
  body{background:#fff!important;color:#000!important}
  #app-header,#app-nav,.no-print,.bg-watermark{display:none!important}
}

const mKey=d=>(d||"").slice(0,7);
const fmt=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>"₹"+Math.round(Number(n||0)).toLocaleString("en-IN");
const fmtK=n=>{const v=Number(n||0);return v>=100000?"₹"+(v/100000).toFixed(2)+"L":v>=1000?"₹"+(v/1000).toFixed(1)+"K":"₹"+Math.round(v);};
const invNo=n=>"DC-"+String(n).padStart(4,"0");

function daysUntilDue(dueDay){
  const now = new Date();
  const curDay = now.getDate();
  if(dueDay >= curDay) return dueDay - curDay;
  const nextMonth = new Date(now.getFullYear(), now.getMonth()+1, dueDay);
  return Math.ceil((nextMonth - now)/(1000*60*60*24));
}

let _toastTimer=null;
function showToast(msg,type="ok"){
  clearTimeout(_toastTimer);
  const el=document.getElementById("toast");
  if(!el)return;
  const bg=type==="err"?"var(--err)":type==="warn"?"var(--warn)":"var(--ok)";
  el.textContent=msg;el.style.background=bg;el.style.color="#fff";el.style.display="block";
  _toastTimer=setTimeout(()=>{el.style.display="none";},3400);
}

// 7. DASHBOARD (STORE OVERVIEW + 6M CHART + CHANNELS + ALERTS)
// ════════════════════════════════════════════════════════════════
function renderDashboard(){
  const now=new Date();
  const thisM=mKey(todayStr());
  const lastM=mKey(new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().split("T")[0]);
  const mS=m=>STATE.sales.filter(s=>mKey(s.date)===m);
  const mRev=m=>mS(m).reduce((a,s)=>a+s.total,0);
  const mProfit=m=>mS(m).reduce((a,s)=>a+s.profit,0);
  const thisRev=mRev(thisM),lastRev=mRev(lastM),thisProfit=mProfit(thisM);
  const totalRev=STATE.sales.reduce((a,s)=>a+s.total,0);
  const growth=lastRev>0?(((thisRev-lastRev)/lastRev)*100).toFixed(1):null;
  const low=STATE.products.filter(p=>p.stock<=p.minStock&&p.stock>0);
  const out=STATE.products.filter(p=>p.stock===0);

  const months6=Array.from({length:6},(_,i)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);
    return{key:mKey(d.toISOString().split("T")[0]),label:d.toLocaleString("en-IN",{month:"short"})};
  });
  const maxRev=Math.max(...months6.map(m=>mRev(m.key)),1);
  const bars=months6.map(({key,label})=>{
    const rev=mRev(key);const h=Math.max((rev/maxRev)*80,4);const isThis=key===thisM;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:9px;color:var(--muted)" class="mono">${rev>0?fmtK(rev):""}</div>
      <div style="width:100%;height:${h}px;background:${isThis?"var(--or)":"var(--border)"};border-radius:4px 4px 0 0;box-shadow:${isThis?"0 0 12px var(--or-glow)":"none"}"></div>
      <div style="font-size:10px;color:${isThis?"var(--or)":"var(--muted)"};font-weight:${isThis?800:500}">${label}</div>
    </div>`;
  }).join("");

  const chCols={Store:"var(--or)",WooCommerce:"#8B5CF6",Amazon:"#F59E0B",Flipkart:"#3B82F6",Instagram:"#EC4899",WhatsApp:"#25D366"};
  const chRows=CHANNELS.map(ch=>{
    const rev=mS(thisM).filter(s=>s.channel===ch).reduce((a,s)=>a+s.total,0);
    const pct=thisRev>0?Math.max(rev/thisRev*100,2):2;
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:11.5px;color:${chCols[ch]||'var(--or)'};font-weight:700">${ch}</span>
        <span style="font-size:11.5px;font-weight:700" class="mono">${fmt(rev)}</span>
      </div>
      <div style="background:var(--border);border-radius:4px;height:5px">
        <div style="background:${chCols[ch]||'var(--or)'};height:5px;border-radius:4px;width:${pct}%"></div>
      </div>
    </div>`;
  }).join("");

  const alertsHTML=(out.slice(0,4).map(p=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px;padding:7px 10px;background:rgba(239,68,68,.1);border-radius:6px;border:1px solid rgba(239,68,68,.3)"><span style="font-size:12px;font-weight:600">${p.name} (${p.sku})</span><span style="font-size:10px;color:var(--err);font-weight:800">OUT OF STOCK</span></div>`).join(""))+
  (low.slice(0,4).map(p=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px;padding:7px 10px;background:rgba(245,158,11,.1);border-radius:6px;border:1px solid rgba(245,158,11,.3)"><span style="font-size:12px;font-weight:600">${p.name} (${p.sku})</span><span style="font-size:10px;color:var(--warn);font-weight:800">LOW: ${p.stock} left</span></div>`).join(""));

  return shell(`
    <!-- Brand Hero Banner -->
    <div class="card" style="margin-bottom:16px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;border-left:4px solid var(--or)">
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        ${devilLogoSVG(135, 56)}
        <div>
          <div style="font-size:11px;color:var(--or);font-weight:800;letter-spacing:2px;text-transform:uppercase">UNIFIED STORE & E-COMMERCE COMMAND CENTER</div>
          <div style="font-size:19px;font-weight:900;color:#fff;margin-top:2px">${STATE.settings.storeName} — Perambur, Chennai</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">"We don't follow trends. We design temptation." · ${STATE.settings.manifesto}</div>
        </div>
      </div>
      <div>${warningBadgeSVG()}</div>
    </div>

    <div class="grid4" style="margin-bottom:16px">
      ${[
        {l:"This Month Revenue",v:fmtK(thisRev),s:growth!==null?(growth>0?"▲":"▼")+" "+Math.abs(growth)+"% vs last month":"Target: ₹2.50L / mo",c:"var(--or)"},
        {l:"This Month Gross Profit",v:fmtK(thisProfit),s:"Margin "+(thisRev>0?((thisProfit/thisRev)*100).toFixed(1):0)+"%",c:"var(--ok)"},
        {l:"All-Time Revenue",v:fmtK(totalRev),s:STATE.sales.length+" total invoices billed",c:"var(--warn)"},
        {l:"CRM Customer Base",v:STATE.customers.length,s:STATE.customers.filter(c=>c.broadcast).length+" in WhatsApp Broadcast",c:"var(--purple)"},
      ].map(s=>`<div class="card" style="border-top:3px solid ${s.c}">
        <div class="lbl">${s.l}</div>
        <div style="font-size:25px;font-weight:900;color:${s.c};margin:4px 0" class="mono">${s.v}</div>
        <div style="font-size:11px;color:var(--muted)">${s.s}</div>
      </div>`).join("")}
    </div>

    <div class="grid2" style="margin-bottom:14px">
      <div class="card">
        <div class="lbl" style="margin-bottom:12px">Omnichannel Revenue — This Month</div>
        ${chRows}
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="lbl">Live Stock Alerts</div>
          <button onclick="go('inventory')" style="background:var(--card2);border:1px solid var(--border);color:var(--text);padding:4px 10px;font-size:10px">Manage Stock →</button>
        </div>
        ${alertsHTML||'<div style="color:var(--ok);font-size:12px;padding:12px 0">✓ All inventory SKUs are stocked above minimum thresholds.</div>'}
      </div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:14px">6-Month Revenue Trajectory</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:105px">${bars}</div>
    </div>`);
}

    if(item.id==="p09" || item.sku==="DC-SOC"){
      if(item.qty >= 3){
        const sets = Math.floor(item.qty / 3);
        const rem = item.qty % 3;
        const totalCost = (sets * 499) + (rem * item.basePrice);
        item.price = Number((totalCost / item.qty).toFixed(2));
        item.comboApplied = true;
        item.comboLabel = "3 @ ₹499";
      } else {
        item.price = item.basePrice;
        item.comboApplied = false;
        item.comboLabel = "";
      }
    }
  });

  // 2. Apparel 3-for-₹999 Pool (Any item marked comboEligible excluding Socks)
  const pool999 = CART.filter(i => i.comboEligible && i.id!=="p09" && i.sku!=="DC-SOC");
  const total999Qty = pool999.reduce((a,i)=>a+i.qty, 0);
  if(total999Qty >= 3){
    const sets = Math.floor(total999Qty / 3);
    const rem = total999Qty % 3;
    const avgRegular = pool999.reduce((a,i)=>a+(i.basePrice*i.qty),0) / total999Qty;
    const poolTotal = (sets * 999) + Math.round(rem * avgRegular);
    const effUnit = Number((poolTotal / total999Qty).toFixed(2));
    pool999.forEach(i => {
      i.price = effUnit;
      i.comboApplied = true;
      i.comboLabel = "3 @ ₹999 COMBO";
    });
  } else {
    pool999.forEach(i => {
      i.price = i.basePrice;
      i.comboApplied = false;
      i.comboLabel = "";
    });
  }
}

function cartTotals(){
  applyAutoCombos();
  const sub = Math.round(CART.reduce((a,i)=>a+i.price*i.qty, 0));
  const discAmt = Math.round(sub * BILL_DISC / 100);
  const total = sub - discAmt;
  const mrpTotal = CART.reduce((a,i)=>a+(i.mrp*i.qty), 0);
  const savings = Math.max(0, mrpTotal - total);
  const profit = Math.round(CART.reduce((a,i)=>a+(i.price-i.cost)*i.qty, 0) - discAmt);
  // Inclusive 5% GST extracted internally
  const gst = Math.round(total - (total * 100 / 105));
  return {sub, discAmt, total, savings, profit, gst};
}

function addToCart(pid){
  const prod=STATE.products.find(p=>p.id===pid);
  if(!prod||prod.stock===0){showToast("Item out of stock","err");return;}
  const ex=CART.find(i=>i.id===pid);
  if(ex){
    if(ex.qty>=prod.stock){showToast("Max stock reached","warn");return;}
    ex.qty++;
  }else{
    CART.push({
      id:pid,name:prod.name,sku:prod.sku,
      basePrice:prod.sell,price:prod.sell,mrp:prod.mrp,cost:prod.cost,
      gst:prod.gst||5,hsn:prod.hsn||"6109",qty:1,
      comboEligible:!!prod.comboEligible,comboApplied:false,comboLabel:""
    });
  }

}

  renderApp();
}

    <td><b>${p.name}</b><div style="font-size:9px;color:var(--muted)">${p.cat}</div></td>
    <td>${p.sku}</td><td>₹${p.cost}</td>
    <td style="color:var(--or);font-weight:700">₹${p.sell}</td>
    <td style="color:var(--muted);text-decoration:line-through">₹${p.mrp}</td>
    <td style="color:${p.stock<=p.minStock?"var(--warn)":"var(--ok)"};font-weight:700">${p.stock}</td>
    <td>${p.comboEligible||p.comboType!=="none"?`<span class="tag" style="background:var(--orG);color:var(--or)">3 @ ₹${p.sku==="DC-SOC"||p.comboType==="499"?499:999}</span>`:"—"}</td>
    <td><div style="display:flex;gap:4px">
      <button onclick="openEditProd('${p.id}')" style="background:var(--border);border:none;color:#fff;padding:4px 8px;font-size:11px">Edit</button>
      <button onclick="restockProd('${p.id}')" style="background:rgba(76,175,125,.15);border:1px solid var(--ok);color:var(--ok);padding:4px 8px;font-size:11px">+Stock</button>
      <button onclick="deleteProd('${p.id}')" style="background:var(--err);border:none;color:#fff;padding:4px 8px;font-size:11px">Del</button>
    </div></td>
  </tr>`).join("");
  return shell(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><h2 style="font-size:18px;font-weight:700">Inventory</h2><div style="font-size:11px;color:var(--muted)">Stock Value: <b style="color:var(--or)">${fmt(totalVal)}</b> · ${STATE.products.length} items</div></div>
      <button onclick="openEditProd(null)" style="background:var(--or);border:none;color:#fff;padding:9px 16px">+ Add Product</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input value="${INV_SEARCH}" oninput="INV_SEARCH=this.value;renderApp()" placeholder="Search SKU or name…" style="flex:1">
      <select onchange="INV_CAT=this.value;renderApp()" style="width:130px">${CATS.map(c=>`<option${c===INV_CAT?" selected":""}>${c}</option>`).join("")}</select>
    </div>
    <div class="card scrollx" style="padding:0"><table><thead><tr><th>Product</th><th>SKU</th><th>Cost</th><th>Final Price</th><th>MRP</th><th>Stock</th><th>Auto-Combo</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function openEditProd(id){
  const p=id?STATE.products.find(x=>x.id===id):null;
  const v=p||{name:"",sku:"",hsn:"6109",cat:"Tops",cost:150,sell:400,mrp:500,gst:5,stock:50,minStock:5,comboEligible:true,comboType:"999"};
  const pop=document.createElement("div");pop.className="modal-bg";pop.id="pf-mod";
  pop.innerHTML=`<div class="modal">
    <h3 style="color:var(--or);margin-bottom:14px">${p?"Edit Product":"Add Product"}</h3>
    <div class="grid2">
      <div style="grid-column:1/-1"><div class="lbl">Product Name</div><input id="pf-name" value="${v.name}"></div>
      <div><div class="lbl">SKU</div><input id="pf-sku" value="${v.sku}"></div>
      <div><div class="lbl">Category</div><select id="pf-cat">${CATS.filter(c=>c!=="All").map(c=>`<option${c===v.cat?" selected":""}>${c}</option>`).join("")}</select></div>
      <div><div class="lbl">Cost ₹</div><input id="pf-cost" type="number" value="${v.cost}"></div>
      <div><div class="lbl">Final Price (MRP Incl) ₹</div><input id="pf-sell" type="number" value="${v.sell}"></div>
      <div><div class="lbl">Strikeout MRP ₹</div><input id="pf-mrp" type="number" value="${v.mrp}"></div>
      <div><div class="lbl">Stock Qty</div><input id="pf-stock" type="number" value="${v.stock}"></div>
      <div style="grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px">
        <input type="checkbox" id="pf-combo" ${v.comboEligible||v.comboType!=="none"?"checked":""} style="width:auto">
        <label for="pf-combo" style="font-size:12px">Enable Auto-Combo (Buy 3 @ ₹999 / Socks @ ₹499)</label>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="saveProdItem('${p?p.id:""}')" style="background:var(--or);border:none;color:#fff;flex:1;padding:10px">Save</button>
      <button onclick="document.getElementById('pf-mod').remove()" style="background:var(--border);border:none;color:var(--muted);flex:1;padding:10px">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(pop);
}

function saveProdItem(id){
  const name=document.getElementById("pf-name").value.trim();
  const sku=document.getElementById("pf-sku").value.trim();
  if(!name||!sku)return;
  const comboEligible=document.getElementById("pf-combo").checked;
  const comboType=comboEligible?(sku==="DC-SOC"?"499":"999"):"none";
  const item={
    id:id||uid(),name,sku,hsn:"6109",
    cat:document.getElementById("pf-cat").value,
    cost:Number(document.getElementById("pf-cost").value)||0,
    sell:Number(document.getElementById("pf-sell").value)||0,
    mrp:Number(document.getElementById("pf-mrp").value)||0,
    stock:Number(document.getElementById("pf-stock").value)||0,
    minStock:5,gst:5,comboEligible,comboType,
    offer:comboEligible?(sku==="DC-SOC"?"Buy 3 @ ₹499":"3 for ₹999 Combo"):""
  };
  if(id)STATE.products=STATE.products.map(p=>p.id===id?item:p);
  else STATE.products.unshift(item);
  saveP();document.getElementById("pf-mod").remove();renderApp();
}

function restockProd(id){
  const p=STATE.products.find(x=>x.id===id);if(!p)return;
  const qty=Number(prompt(`Add stock quantity for ${p.name}:`,"10"))||0;
  if(qty>0){p.stock+=qty;saveP();renderApp();}
}
function deleteProd(id){
  if(confirm("Delete product?")){STATE.products=STATE.products.filter(x=>x.id!==id);saveP();renderApp();}
}

function renderCustomers(){
  const rows=STATE.customers.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.visits||1}</td><td style="color:var(--or);font-weight:700">${fmt(c.totalSpend||0)}</td><td>${c.lastVisit||"-"}</td></tr>`).join("");
  return shell(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h2 style="font-size:18px;font-weight:700">Customers (${STATE.customers.length})</h2></div><div class="card scrollx" style="padding:0"><table><thead><tr><th>Name</th><th>Phone</th><th>Visits</th><th>Total Spend</th><th>Last Visit</th></tr></thead><tbody>${rows||`<tr><td colspan="5" style="text-align:center;padding:20px">No customers yet</td></tr>`}</tbody></table></div>`);
}

let SALES_PERIOD="month";
function renderSales(){
  const now=new Date();
  const filtered=STATE.sales.filter(s=>{
    const d=new Date(s.date);
    if(SALES_PERIOD==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(SALES_PERIOD==="year")return d.getFullYear()===now.getFullYear();
    return true;
  });
  const rev=filtered.reduce((a,s)=>a+s.total,0);
  const profit=filtered.reduce((a,s)=>a+s.profit,0);
  const rows=filtered.map(s=>`<tr>
    <td style="color:var(--or);font-weight:700">${s.invoiceNo}</td><td>${s.date}</td><td>${s.customerName}</td><td>${s.customerPhone}</td>
    <td style="font-weight:700">${fmt(s.total)}</td><td style="color:var(--ok)">${fmt(s.profit)}</td><td>${s.payMode}</td>
    <td><div style="display:flex;gap:4px">
      <button onclick="waInvoice('${s.id}')" style="background:var(--wa);border:none;color:#fff;padding:3px 8px;font-size:10px">WA</button>
      <button onclick="editBill('${s.id}')" style="background:var(--border);border:none;color:#fff;padding:3px 8px;font-size:10px">Edit</button>
      <button onclick="deleteBill('${s.id}')" style="background:var(--err);border:none;color:#fff;padding:3px 8px;font-size:10px">Del</button>
    </div></td>
  </tr>`).join("");
  return shell(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px;font-weight:700">Sales Tracker</h2>
      <div style="display:flex;gap:6px">${[["month","Monthly"],["year","Yearly"],["all","All Time"]].map(([k,l])=>`<button onclick="SALES_PERIOD='${k}';renderApp()" style="background:${SALES_PERIOD===k?"var(--or)":"var(--border)"};border:none;color:#fff;padding:6px 12px">${l}</button>`).join("")}</div>
    </div>
    <div class="grid3" style="margin-bottom:14px">
      <div class="card"><div class="lbl">Revenue (${SALES_PERIOD})</div><div style="font-size:20px;font-weight:800;color:var(--or)">${fmt(rev)}</div></div>
      <div class="card"><div class="lbl">Profit</div><div style="font-size:20px;font-weight:800;color:var(--ok)">${fmt(profit)}</div></div>
      <div class="card"><div class="lbl">Bills</div><div style="font-size:20px;font-weight:800">${filtered.length}</div></div>
    </div>
    <div class="card scrollx" style="padding:0"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Phone</th><th>Total</th><th>Profit</th><th>Mode</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function editBill(id){
  const s=STATE.sales.find(x=>x.id===id);if(!s)return;
  const n=prompt("Customer Name:",s.customerName);
  const p=prompt("Phone:",s.customerPhone);
  const t=prompt("Total Bill ₹:",s.total);
  const m=prompt("Payment Mode (Cash/UPI/Card/Online):",s.payMode);
  if(n)s.customerName=n;if(p)s.customerPhone=p;if(t)s.total=Number(t);if(m)s.payMode=m;
  saveS();renderApp();
}

function deleteBill(id){
  const s=STATE.sales.find(x=>x.id===id);if(!s||!confirm("Delete bill and restore stock?"))return;
  s.items.forEach(i=>{const p=STATE.products.find(x=>x.id===i.id);if(p)p.stock+=i.qty;});
  saveP();STATE.sales=STATE.sales.filter(x=>x.id!==id);saveS();renderApp();
}

function renderPurchases(){
  const totalITC=STATE.purchases.reduce((a,p)=>a+Number(p.gstAmt||0),0);
  const rows=STATE.purchases.map((p,i)=>`<tr><td>${p.date}</td><td><b>${p.supplier}</b></td><td>${p.billNo}</td><td>${p.gstin||"-"}</td><td>${fmt(p.taxable)}</td><td style="color:var(--ok);font-weight:700">${fmt(p.gstAmt)}</td><td><b>${fmt(p.total)}</b></td><td><button onclick="STATE.purchases.splice(${i},1);savePB();renderApp()" style="background:none;border:none;color:var(--err)">✕</button></td></tr>`).join("");
  return shell(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><h2 style="font-size:18px;font-weight:700">📥 Purchase Bills (GST Input Credit)</h2><div style="font-size:11px;color:var(--muted)">Total Claimable ITC: <b style="color:var(--ok)">${fmt(totalITC)}</b></div></div>
      <button onclick="addPurBill()" style="background:var(--or);border:none;color:#fff;padding:9px 16px">+ Log Purchase Bill</button>
    </div>
    <div class="card scrollx" style="padding:0"><table><thead><tr><th>Date</th><th>Supplier</th><th>Bill No</th><th>GSTIN</th><th>Taxable</th><th>Input GST</th><th>Total</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="8" style="text-align:center;padding:20px">No purchase bills logged</td></tr>`}</tbody></table></div>`);
}

function addPurBill(){
  const supplier=prompt("Supplier Name:");if(!supplier)return;
  const billNo=prompt("Invoice / Bill No:")||"INV-01";
  const gstin=prompt("Supplier GSTIN:")||"";
  const taxable=Number(prompt("Taxable Value ₹:","0"))||0;
  const rate=Number(prompt("GST Rate % (e.g. 5, 12, 18):","5"))||5;
  const gstAmt=Number((taxable*rate/100).toFixed(2));
  STATE.purchases.unshift({id:uid(),date:todayStr(),supplier,billNo,gstin,taxable,gstRate:rate,gstAmt,total:taxable+gstAmt});
  savePB();renderApp();
}

function renderEOD(){
  const ts=STATE.sales.filter(s=>s.date===todayStr());
  const sum=m=>ts.filter(s=>s.payMode===m).reduce((a,s)=>a+s.total,0);
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">🏁 End of Day (${todayStr()})</h2>
    <div class="grid3">${[["Cash",sum("Cash")],["UPI",sum("UPI")],["Card",sum("Card")],["Online",sum("Online")]].map(([l,v])=>`<div class="card"><div class="lbl">${l}</div><div style="font-size:20px;font-weight:800;color:var(--or)">${fmt(v)}</div></div>`).join("")}</div>`);
}

function renderExpenses(){
  const rows=STATE.expenses.map((e,i)=>`<tr><td><b>${e.name}</b></td><td><input type="number" value="${e.amount}" onchange="STATE.expenses[${i}].amount=Number(this.value);saveEX();renderApp()" style="width:110px"></td><td>${e.cat}</td><td><button onclick="STATE.expenses.splice(${i},1);saveEX();renderApp()" style="background:none;border:none;color:var(--err)">✕</button></td></tr>`).join("");
  return shell(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h2 style="font-size:18px;font-weight:700">💸 Business Expenses</h2><button onclick="const n=prompt('Expense Name:');if(n){STATE.expenses.push({id:uid(),name:n,cat:'Variable',amount:0,freq:'Monthly'});saveEX();renderApp()}" style="background:var(--or);border:none;color:#fff;padding:8px 14px">+ Add Expense</button></div><div class="card scrollx" style="padding:0"><table><thead><tr><th>Expense</th><th>Amount ₹</th><th>Category</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function renderPersonal(){
  if(!PERSONAL_UNLOCKED){requestPersonalAccess();return"";}
  const rows=STATE.personal.map((p,i)=>`<tr><td><b>${p.name}</b></td><td>${p.cat}</td><td><input type="number" value="${p.amount}" onchange="STATE.personal[${i}].amount=Number(this.value);savePF();renderApp()" style="width:110px"></td><td>${p.date}</td><td><button onclick="STATE.personal.splice(${i},1);savePF();renderApp()" style="background:none;border:none;color:var(--err)">✕</button></td></tr>`).join("");
  return shell(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h2 style="font-size:18px;font-weight:700">🔒 Personal Expenses (PIN Locked)</h2><div style="display:flex;gap:8px"><button onclick="const n=prompt('Entry:');if(n){STATE.personal.unshift({id:uid(),name:n,cat:'Personal',amount:Number(prompt('Amount ₹:'))||0,date:todayStr()});savePF();renderApp()}" style="background:var(--or);border:none;color:#fff;padding:8px 14px">+ Add</button><button onclick="PERSONAL_UNLOCKED=false;go('dashboard')" style="background:var(--border);border:none;color:#fff;padding:8px 14px">Lock</button></div></div><div class="card scrollx" style="padding:0"><table><thead><tr><th>Item</th><th>Type</th><th>Amount ₹</th><th>Date</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function renderReturns(){
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">↩ Returns (${STATE.returns.length})</h2><div class="card">Use Sales tab → Edit or Delete bill to restore stock automatically.</div>`);
}
function renderVendors(){
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">🚚 Vendors</h2><div class="card">Log all supplier GST invoices directly in the <b>Purchases (GST)</b> tab.</div>`);
}

function renderGST(){
  const outGST=STATE.sales.reduce((a,s)=>a+(s.gst||Math.round(s.total-s.total/1.05)),0);
  const inGST=STATE.purchases.reduce((a,p)=>a+Number(p.gstAmt||0),0);
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">📋 GST Summary (Internal Extraction)</h2>
    <div class="grid3">
      <div class="card"><div class="lbl">Output GST (From Inclusive MRP)</div><div style="font-size:20px;font-weight:800;color:var(--err)">${fmt(outGST)}</div></div>
      <div class="card"><div class="lbl">Input GST (From Purchase Bills)</div><div style="font-size:20px;font-weight:800;color:var(--ok)">${fmt(inGST)}</div></div>
      <div class="card"><div class="lbl">Net GST Payable</div><div style="font-size:20px;font-weight:800;color:var(--or)">${fmt(Math.max(0,outGST-inGST))}</div></div>
    </div>`);
}

function renderSettings(){
  const s=STATE.settings;
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">⚙ Settings & Theme</h2>
    <div class="card" style="max-width:520px">
      <div class="lbl">Theme Color</div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button onclick="STATE.settings.theme='spider';saveST();renderApp()" style="background:#E60012;color:#fff;border:none;padding:8px 14px">Spider Red</button>
        <button onclick="STATE.settings.theme='orange';saveST();renderApp()" style="background:#FF6B00;color:#000;border:none;padding:8px 14px">Original Orange</button>
        <button onclick="STATE.settings.theme='gold';saveST();renderApp()" style="background:#F59E0B;color:#000;border:none;padding:8px 14px">Luxury Gold</button>
      </div>
      <div class="lbl">Store Name</div><input id="st-n" value="${s.storeName}" style="margin-bottom:8px">
      <div class="lbl">Address</div><input id="st-a" value="${s.address}" style="margin-bottom:8px">
      <div class="lbl">Phone</div><input id="st-p" value="${s.phone}" style="margin-bottom:8px">
      <div class="lbl">Tagline</div><input id="st-t" value="${s.tagline}" style="margin-bottom:14px">
      <button onclick="STATE.settings.storeName=document.getElementById('st-n').value;STATE.settings.address=document.getElementById('st-a').value;STATE.settings.phone=document.getElementById('st-p').value;STATE.settings.tagline=document.getElementById('st-t').value;saveST();showToast('Saved!')" style="background:var(--or);border:none;color:#fff;padding:10px 20px">Save Settings</button>
    </div>`);
}

function renderApp(){
  const map={dashboard:renderDashboard,billing:renderBilling,inventory:renderInventory,customers:renderCustomers,sales:renderSales,purchases:renderPurchases,eod:renderEOD,expenses:renderExpenses,returns:renderReturns,vendors:renderVendors,gst:renderGST,personal:renderPersonal,settings:renderSettings};
  document.getElementById("root").innerHTML=(map[STATE.tab]||renderDashboard)();
}

if(isLoggedIn()){renderApp();}else{renderLogin(false);}
</script>
</body>
</html>
