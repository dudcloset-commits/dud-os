<html lang="en">

<meta charset="UTF-8"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0C;color:#F0F0F0;font-family:'Inter',system-ui,sans-serif;min-height:100vh}
:root{
  --bg:#0A0A0C;--surf:#121216;--card:#16161D;--card2:#22222C;--border:#2A2A36;
  --or:#E60012;--or-dark:#99000C;--text:#F0F0F0;--muted:#888;--dim:#555;
  --ok:#4CAF7D;--warn:#F0A500;--err:#E84545;--wa:#25D366;
}
input,select,button{font-family:inherit}
input,select{background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:13px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--or)}
button{cursor:pointer;border-radius:6px;font-weight:600;font-size:13px;transition:opacity .15s;white-space:nowrap}
button:hover{opacity:.85}
.spider-btn{background:linear-gradient(135deg,var(--or),var(--or-dark));color:#fff;border:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;font-size:12px;border-bottom:1px solid var(--border)}
th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:#111116}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#111116;border-radius:12px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border:1px solid var(--border)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.5);white-space:nowrap}
.lbl{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pill{border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:11px;background:var(--card2);color:var(--muted)}
.pill.active{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.scrollx{overflow-x:auto}
@media print{
  body{background:#fff;color:#000}
  #app-header,#app-nav,#no-print{display:none!important}
  .print-invoice{display:block!important}
}
</style>
</head>

const AUTH = { user:"dud closet", pass:"dudneverdies@21", key:"dc_auth" };
let isPersonalUnlocked = false;

function isLoggedIn(){ return localStorage.getItem(AUTH.key)==="1"; }

function renderLogin(err){
  document.getElementById("root").innerHTML=`
  <div style="min-height:100vh;background:#0A0A0C;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="background:#121216;border:1px solid #22222C;border-radius:14px;padding:36px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 0 30px rgba(0,0,0,0.8)">

      <div style="font-size:11px;color:var(--or);letter-spacing:4px;margin-bottom:28px">STORE OS</div>
      ${err?`<div style="background:rgba(232,69,69,.12);border:1px solid rgba(232,69,69,.35);color:#E84545;border-radius:7px;padding:8px 12px;font-size:12px;margin-bottom:16px">⚠ Incorrect username or password</div>`:""}

        <div class="lbl">Username</div>
        <input id="login-user" type="text" placeholder="Enter username" autocomplete="username">
      </div>
      <div style="text-align:left;margin-bottom:20px">
        <div class="lbl">Password</div>
        <input id="login-pass" type="password" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button onclick="doLogin()" class="spider-btn" style="width:100%;padding:13px;border-radius:7px;font-weight:900;font-size:15px;letter-spacing:1px;margin-bottom:14px">SIGN IN</button>
      <div style="font-size:10px;color:#555;font-style:italic">"When in doubt, wear DUD"</div>
    </div>
  </div>`;
  setTimeout(()=>{
    const u=document.getElementById("login-user");
    const p=document.getElementById("login-pass");
    if(u) u.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("login-pass").focus(); });
    if(p) p.addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  },100);
}

function doLogin(){
  const u=(document.getElementById("login-user").value||"").trim().toLowerCase();
  const p=(document.getElementById("login-pass").value||"").trim();
  if(u===AUTH.user.toLowerCase()&&p===AUTH.pass){
    localStorage.setItem(AUTH.key,"1");
    renderApp();
  } else { renderLogin(true); }
}

function doLogout(){
  if(!confirm("Log out of DUD Closet?"))return;
  localStorage.removeItem(AUTH.key);
  renderLogin(false);
}

function requestPersonalAccess(){
  if(isPersonalUnlocked){ go('personal'); return; }
  const pop=document.createElement("div");pop.className="modal-bg";pop.id="pin-pop";
  pop.innerHTML=`<div class="modal" style="max-width:320px;text-align:center;border:1px solid var(--or)">
    <div style="font-size:32px;margin-bottom:8px">🔒</div>
    <div style="font-weight:900;font-size:16px;color:#fff;margin-bottom:4px">Restricted Access</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:16px">Enter PIN to unlock Personal Financials</div>
    <input type="password" id="pin-input" maxlength="4" placeholder="••••" style="text-align:center;font-size:24px;letter-spacing:10px;padding:10px;margin-bottom:14px">
    <div style="display:flex;gap:8px">
      <button onclick="verifyPin()" class="spider-btn" style="flex:1;padding:10px;font-weight:800">Unlock</button>
      <button onclick="document.getElementById('pin-pop').remove()" style="background:var(--card2);color:var(--muted);border:none;flex:1;padding:10px">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(pop);
  setTimeout(()=>document.getElementById("pin-input").focus(),100);
}

function verifyPin(){
  const val=document.getElementById("pin-input").value;
  if(val==="6666"||val==="1234"){
    isPersonalUnlocked=true;
    document.getElementById("pin-pop").remove();
    go('personal');
  } else { showToast("Incorrect PIN","err"); }
}

function lockPersonal(){
  isPersonalUnlocked=false;
  go('dashboard');
  showToast("Personal tab locked securely");
}

let _toastTimer=null;
function showToast(msg,type="ok"){
  clearTimeout(_toastTimer);
  const el=document.getElementById("toast");
  if(!el)return;
  el.textContent=msg;
  el.style.background=type==="err"?"var(--err)":type==="warn"?"var(--warn)":"var(--ok)";
  el.style.display="block";
  _toastTimer=setTimeout(()=>{el.style.display="none";},3200);
}
function go(tab){STATE.tab=tab;renderApp();}

function shell(content){
  const tabs=[
    {id:"dashboard",icon:"◈",label:"Dashboard"},
    {id:"billing",icon:"🧾",label:"POS Billing"},
    {id:"inventory",icon:"📦",label:"Inventory"},
    {id:"sales",icon:"📊",label:"Sales Ledger"},
    {id:"purchases",icon:"📥",label:"Purchase Bills"},
    {id:"customers",icon:"👥",label:"Customers"},
    {id:"eod",icon:"🏁",label:"EOD Recon"},
    {id:"expenses",icon:"💸",label:"Expenses"},
    {id:"returns",icon:"↩",label:"Returns"},
    {id:"vendors",icon:"🚚",label:"Vendors"},
    {id:"gst",icon:"📋",label:"GST Filing"},
    {id:"personal",icon:"🔒",label:"Personal"},
    {id:"settings",icon:"⚙",label:"Settings"}
  ];
  const navItems=tabs.map(t=>`
    <button onclick="${t.id==='personal'?'requestPersonalAccess()':'go(\''+t.id+'\')'}" style="background:none;border:none;border-bottom:2px solid ${STATE.tab===t.id?"var(--or)":"transparent"};color:${STATE.tab===t.id?"var(--or)":"var(--muted)"};padding:11px 14px;font-size:12px;font-weight:${STATE.tab===t.id?700:400};display:flex;align-items:center;gap:5px">
      <span style="font-size:14px">${t.icon}</span><span>${t.label}</span>
    </button>`).join("");
  const dt=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
  return `
  <div id="toast" class="toast" style="display:none"></div>
  <header id="app-header" style="background:var(--surf);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.7)">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:6px;background:#000;border:1px solid var(--or);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--or);font-size:14px">D</div>
      <div>
        <div style="font-size:16px;font-weight:900;letter-spacing:2px">DUD <span style="color:var(--or)">OS</span></div>
        <div style="font-size:8px;color:var(--muted);letter-spacing:3px">ALL DUD. NO DUDS.</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:11px;color:var(--muted)">GSTIN: <strong style="color:#fff">${GSTIN}</strong></div>
      <button onclick="doLogout()" style="background:transparent;border:1px solid var(--border);color:#888;padding:4px 10px;border-radius:5px;font-size:11px">⏻ Logout</button>
    </div>
  </header>
  <nav id="app-nav" style="background:var(--surf);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px">
    ${navItems}
  </nav>
  <main style="padding:16px;max-width:1200px;margin:0 auto">
    ${content}
  </main>`;
}

// ════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════
function renderDashboard(){
  const now=new Date();
  const thisM=mKey(todayStr());
  const mS=m=>STATE.sales.filter(s=>mKey(s.date)===m);
  const thisRev=mS(thisM).reduce((a,s)=>a+s.total,0);
  const thisProfit=mS(thisM).reduce((a,s)=>a+s.profit,0);
  const totalRev=STATE.sales.reduce((a,s)=>a+s.total,0);
  const low=STATE.products.filter(p=>p.stock<=p.minStock&&p.stock>0);
  const out=STATE.products.filter(p=>p.stock===0);

  return shell(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:18px;font-weight:700">Executive Store Overview</h2>
      <div style="font-size:12px;color:var(--muted)">Daily Sales Target: <strong style="color:#fff">₹8,000 / day</strong></div>
    </div>
    <div class="grid3" style="margin-bottom:16px">
      ${[
        {l:"This Month Revenue",v:fmtK(thisRev),s:"Goal: ₹2,40,000 / mo",c:"var(--or)"},
        {l:"This Month Profit",v:fmtK(thisProfit),s:"Margin "+(thisRev>0?((thisProfit/thisRev)*100).toFixed(1):0)+"%",c:"var(--ok)"},
        {l:"Total Sales",v:fmtK(totalRev),s:STATE.sales.length+" bills generated",c:"var(--warn)"},
        {l:"Customer Database",v:STATE.customers.length,s:STATE.customers.filter(c=>c.broadcast).length+" in broadcast",c:"#8B44AC"},
      ].map(s=>`<div class="card" style="border-left:3px solid ${s.c}">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${s.l}</div>
        <div style="font-size:24px;font-weight:800;color:${s.c}">${s.v}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:3px">${s.s}</div>
      </div>`).join("")}
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="card">
        <div style="font-size:11px;color:var(--or);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Inventory Health</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Healthy Items</span><strong style="color:var(--ok)">${STATE.products.length-low.length-out.length}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Low Stock Warning</span><strong style="color:var(--warn)">${low.length}</strong></div>
        <div style="display:flex;justify-content:space-between"><span>Out of Stock</span><strong style="color:var(--err)">${out.length}</strong></div>
      </div>
      <div class="card">
        <div style="font-size:11px;color:var(--or);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">GST Summary (${thisM})</div>

let CART=[]; let BILL_CUST={phone:"",name:"",found:null}; let BILL_DISC=0; let BILL_PAY="Cash"; let BILL_CHAN="Store"; let BILL_CAT="All"; let BILL_SEARCH="";

function recalculateCart(){
  let sub=0;
  CART.forEach(item=>{
    if(item.comboEligible && item.qty>=3){
      const setsOfThree = Math.floor(item.qty/3);
      const rem = item.qty % 3;
      const totalCost = (setsOfThree*999) + (rem*item.baseSell);
      item.sell = Number((totalCost/item.qty).toFixed(2));
      item.appliedCombo = true;
    } else {
      item.sell = item.baseSell;
      item.appliedCombo = false;
    }
    sub += Math.round(item.sell * item.qty);
  });
  const discAmt=Math.round(sub*BILL_DISC/100);
  const total=sub-discAmt;
  const gst=Math.round(total - (total/1.05));
  const profit=CART.reduce((a,i)=>a+(i.sell-i.cost)*i.qty,0)-discAmt;
  const savings=CART.reduce((a,i)=>a+(i.mrp-i.sell)*i.qty,0)+discAmt;
  return {sub,discAmt,total,gst,profit,savings};
}

function addToCart(pid){
  const p=STATE.products.find(p=>p.id===pid);
  if(!p||p.stock<=0)return;
  const ex=CART.find(i=>i.id===pid);
  if(ex){
    if(ex.qty>=p.stock){ showToast("Max stock reached","warn"); return; }
    ex.qty++;
  } else {
    CART.push({id:p.id,name:p.name,sku:p.sku,baseSell:p.sell,sell:p.sell,mrp:p.mrp,cost:p.cost,gst:p.gst,comboEligible:p.comboEligible,qty:1});
  }
  renderApp();
}

function updateCartQty(pid,delta){
  const item=CART.find(i=>i.id===pid);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0) CART=CART.filter(i=>i.id!==pid);
  renderApp();
}

function removeFromCart(pid){ CART=CART.filter(i=>i.id!==pid); renderApp(); }

function setCustPhone(v){ BILL_CUST.phone=v; }
function lookupCust(){
  const phone=document.getElementById("cust-phone")?document.getElementById("cust-phone").value.trim():BILL_CUST.phone.trim();
  BILL_CUST.phone=phone;
  const c=STATE.customers.find(c=>c.phone===phone);
  if(c){ BILL_CUST.found=c; BILL_CUST.name=c.name; showToast("Welcome back, "+c.name+"!"); }
  else BILL_CUST.found=null;
  renderApp();
}

function generateBill(){
  const phone=document.getElementById("cust-phone")?document.getElementById("cust-phone").value.trim():BILL_CUST.phone.trim();
  const name=document.getElementById("cust-name")?document.getElementById("cust-name").value.trim():BILL_CUST.name.trim();
  if(CART.length===0){ showToast("Cart is empty","err"); return; }
  if(!phone){ showToast("Phone number required","err"); return; }
  if(!name){ showToast("Customer name required","err"); return; }

  const {sub,discAmt,total,gst,profit,savings}=recalculateCart();
  let cust=STATE.customers.find(c=>c.phone===phone);
  const isNew=!cust;
  if(isNew){
    cust={id:uid(),phone,name,createdAt:todayStr(),lastVisit:todayStr(),broadcast:true,totalSpend:total,visits:1};
    STATE.customers.unshift(cust);
  } else {
    cust.visits=(cust.visits||0)+1; cust.totalSpend=(cust.totalSpend||0)+total; cust.lastVisit=todayStr();
    STATE.customers=STATE.customers.map(c=>c.phone===phone?cust:c);
  }
  saveC();

  const sale={
    id:uid(),invoiceNo:invNo(STATE.invCounter),date:todayStr(),channel:BILL_CHAN,
    customerName:name,customerPhone:phone,
    items:CART.map(i=>({...i})),
    sub,discAmt,discount:BILL_DISC,gst,total,profit,savings,
    payMode:BILL_PAY,staffName:STATE.settings.staffName,isNew
  };
  STATE.sales.unshift(sale); saveS();

  CART.forEach(ci=>{
    const p=STATE.products.find(p=>p.id===ci.id);
    if(p) p.stock=Math.max(0,p.stock-ci.qty);
  });
  saveP();
  STATE.invCounter++; saveIC();

  showInvoiceModal(sale,cust,isNew);
  CART=[]; BILL_CUST={phone:"",name:"",found:null};
  renderApp();
}

function showInvoiceModal(sale,cust,isNew){
  const pop=document.createElement("div");pop.className="modal-bg";pop.id="inv-modal";
  pop.innerHTML=`<div class="modal">
    <div style="text-align:center;margin-bottom:14px">
      <div style="color:var(--ok);font-size:36px">✓</div>
      <div style="font-weight:900;font-size:18px;color:#fff">${sale.invoiceNo}</div>

      <tbody>${rows.length>0?rows:`<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--dim)">No sales logged yet.</td></tr>`}</tbody>
    </table></div></div>`);
}

// ════════════════════════════════════
// OTHER MODULES (CUSTOMERS, EXPENSES, EOD, VENDORS, RETURNS, GST, SETTINGS)
// ════════════════════════════════════
function renderCustomers(){
  const rows=STATE.customers.map(c=>`
    <tr>
      <td style="font-weight:700">${c.name}</td>
      <td style="color:var(--muted)">${c.phone}</td>
      <td>${c.visits||1}</td>
      <td style="color:var(--or);font-weight:700">₹${c.totalSpend||0}</td>
      <td>${c.broadcast?'<span class="tag" style="background:rgba(37,211,102,0.2);color:var(--wa)">YES</span>':'NO'}</td>
    </tr>`).join('');
  return shell(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px;font-weight:700">Customer CRM (${STATE.customers.length})</h2>
      <button onclick="exportBroadcast()" style="background:var(--wa);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:700">Export Broadcast</button>
    </div>
    <div class="card" style="padding:0"><div class="scrollx"><table>
      <thead><tr><th>Name</th><th>Phone</th><th>Visits</th><th>Spend</th><th>Broadcast</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`);
}

function exportBroadcast(){
  const txt=STATE.customers.filter(c=>c.broadcast).map(c=>`${c.name}\t+91${c.phone}`).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'})); a.download='DUD_Broadcast.txt'; a.click();
}

function renderEOD(){
  const ts=STATE.sales.filter(s=>s.date===todayStr());
  const cash=ts.filter(s=>s.payMode==='Cash').reduce((a,s)=>a+s.total,0);
  const upi=ts.filter(s=>s.payMode==='UPI').reduce((a,s)=>a+s.total,0);
  const card=ts.filter(s=>s.payMode==='Card').reduce((a,s)=>a+s.total,0);
  const total=ts.reduce((a,s)=>a+s.total,0);

  return shell(`
    <h2 style="font-size:18px;font-weight:700;margin-bottom:14px">End of Day Reconciliation (Kotak)</h2>
    <div class="grid3" style="margin-bottom:14px">
      <div class="card"><div>Cash in Drawer</div><div style="font-size:20px;font-weight:800;color:var(--ok)">₹${cash}</div></div>
      <div class="card"><div>UPI (Kotak Settlement)</div><div style="font-size:20px;font-weight:800;color:var(--or)">₹${upi}</div></div>
      <div class="card"><div>Card Terminal</div><div style="font-size:20px;font-weight:800;color:var(--warn)">₹${card}</div></div>
    </div>
    <div class="card"><strong>Total Today: ₹${total}</strong> across ${ts.length} orders.</div>`);
}

function renderExpenses(){
  const rows=STATE.expenses.map((e,i)=>`
    <tr>
      <td>${e.name}</td>
      <td><input type="number" value="${e.amount}" onchange="STATE.expenses[${i}].amount=Number(this.value);saveEX();renderApp()" style="width:100px"></td>
      <td>${e.cat}</td>
      <td>${e.paid?'<span class="tag" style="background:rgba(76,175,125,.2);color:var(--ok)">PAID</span>':'PENDING'}</td>
    </tr>`).join('');
  return shell(`
    <h2 style="font-size:18px;font-weight:700;margin-bottom:14px">Store Expenses</h2>
    <div class="card" style="padding:0"><div class="scrollx"><table>
      <thead><tr><th>Expense</th><th>Amount ₹</th><th>Type</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`);
}

function renderReturns(){
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">Returns & Exchanges</h2><div class="card">No active return requests pending.</div>`);
}

function renderVendors(){
  return shell(`<h2 style="font-size:18px;font-weight:700;margin-bottom:14px">Supplier & Vendor Directory</h2><div class="card">Vendors: Delhi Hub, Surat Mills, Local Chennai Suppliers.</div>`);
}

function renderGST(){
  const thisM=mKey(todayStr());
  const mSales=STATE.sales.filter(s=>mKey(s.date)===thisM);
  const rev=mSales.reduce((a,s)=>a+s.total,0);
  const outGst=Math.round(rev*0.05/1.05);
  const inGst=STATE.purchases.reduce((a,p)=>a+p.tax,0);

  return shell(`
    <h2 style="font-size:18px;font-weight:700;margin-bottom:14px">GST Tax Summary (${thisM})</h2>
    <div class="grid3" style="margin-bottom:14px">
      <div class="card"><div>Output GST (Sales)</div><div style="font-size:20px;font-weight:800;color:var(--err)">₹${outGst}</div></div>
      <div class="card"><div>Input GST (Purchases)</div><div style="font-size:20px;font-weight:800;color:var(--ok)">₹${inGst}</div></div>
      <div class="card"><div>Net GST Payable</div><div style="font-size:20px;font-weight:800;color:var(--or)">₹${Math.max(0,outGst-inGst)}</div></div>
    </div>`);
}

function renderSettings(){
  return shell(`
    <h2 style="font-size:18px;font-weight:700;margin-bottom:14px">System Settings</h2>
    <div class="card" style="max-width:500px">
      <div class="lbl">Store Address</div><input value="${STATE.settings.address}" onchange="STATE.settings.address=this.value;saveST()" style="margin-bottom:10px">
      <div class="lbl">Phone #</div><input value="${STATE.settings.phone}" onchange="STATE.settings.phone=this.value;saveST()" style="margin-bottom:10px">
      <div class="lbl">Tagline</div><input value="${STATE.settings.tagline}" onchange="STATE.settings.tagline=this.value;saveST()">
    </div>`);
}

// ════════════════════════════════════
// ROUTER & APP BOOT
// ════════════════════════════════════
function renderApp(){
  let html="";
  if(STATE.tab==="dashboard") html=renderDashboard();
  else if(STATE.tab==="billing") html=renderBilling();
  else if(STATE.tab==="inventory") html=renderInventory();
  else if(STATE.tab==="sales") html=renderSales();
  else if(STATE.tab==="purchases") html=renderPurchases();
  else if(STATE.tab==="customers") html=renderCustomers();
  else if(STATE.tab==="eod") html=renderEOD();
  else if(STATE.tab==="expenses") html=renderExpenses();
  else if(STATE.tab==="returns") html=renderReturns();
  else if(STATE.tab==="vendors") html=renderVendors();
  else if(STATE.tab==="gst") html=renderGST();
  else if(STATE.tab==="personal") html=renderPersonal();
  else if(STATE.tab==="settings") html=renderSettings();
  document.getElementById("root").innerHTML=html;
}

if(isLoggedIn()){ renderApp(); } else { renderLogin(false); }
</script>
</body>
</html>
